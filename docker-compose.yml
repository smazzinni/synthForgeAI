# Local development stack: Postgres + the app.
#   docker compose up -d db                 # just the database (use with `npm run dev`)
#   docker compose up --build               # database + production build of the app
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: synthforge
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/synthforge
    ports: ["3000:3000"]
volumes:
  pgdata:
