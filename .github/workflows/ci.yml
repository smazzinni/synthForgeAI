name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synthforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synthforge
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prisma generate + migrate
        run: npx prisma generate && npx prisma migrate deploy
      - name: Lint
        run: npx eslint src --quiet
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Smoke test production server
        run: |
          node .next/standalone/server.js &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
          curl -sf http://localhost:3000/api/health | tee /dev/stderr | grep -q '"storage":"ok"'
        env:
          PORT: 3000
          HOSTNAME: 127.0.0.1

  e2e-live-db:
    name: E2E (auth, generation, live Postgres + MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synthforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synthforge
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate && npx prisma migrate deploy
      - run: npm run build
      - name: Seed external test databases
        run: ./e2e/seed.sh
        env:
          PG_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MYSQL_ROOT_PWD: root
      - name: Start mock AI
        run: (node e2e/mock-ai.mjs > mock-ai.log 2>&1 &)
        env:
          MOCK_AI_PORT: 4600
      - name: Start server (auth required, private hosts allowed for the test DBs)
        run: |
          cp -r .next/static .next/standalone/.next/ && cp -r public .next/standalone/
          (cd .next/standalone && node server.js > ../../server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/api/health && break; sleep 1; done
        env:
          PORT: 3000
          HOSTNAME: 127.0.0.1
          AUTH_REQUIRED: "true"
          CONNECTION_ENCRYPTION_KEY: e2e-key
          ALLOW_PRIVATE_DB_HOSTS: "true"
          INSECURE_COOKIES: "true"
          DEEPSEEK_API_KEY: test
          DEEPSEEK_BASE_URL: http://127.0.0.1:4600
      - name: Run generation edge cases (disconnects, stop, messy AI output, scale-up integrity)
        run: node e2e/generation.mjs
        env:
          BASE: http://127.0.0.1:3000
      - name: Run live-DB scenarios
        run: node e2e/live-db.mjs
        env:
          BASE: http://127.0.0.1:3000
      - name: Server log
        if: failure()
        run: tail -200 server.log

  package-managers:
    name: Install & test with ${{ matrix.pm }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pm: [yarn, pnpm, bun]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        if: matrix.pm == 'bun'
      - name: Enable yarn / pnpm
        if: matrix.pm != 'bun'
        run: npm install -g ${{ matrix.pm == 'yarn' && 'yarn@1' || 'pnpm@10' }}
      - name: Install (without the npm lockfile)
        run: |
          rm -f package-lock.json
          case "${{ matrix.pm }}" in
            yarn) yarn install --non-interactive ;;
            pnpm) pnpm install ;;
            bun)  bun install ;;
          esac
      - name: Type-check and unit tests
        run: |
          case "${{ matrix.pm }}" in
            yarn) yarn tsc --noEmit && yarn test ;;
            pnpm) pnpm exec tsc --noEmit && pnpm test ;;
            bun)  bunx tsc --noEmit && bun run test ;;
          esac

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: synthforge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
